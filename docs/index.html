<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran Verse Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .container {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .header {
    text-align: center;
  }
  .header h1 {
    font-size: 1rem;
    font-weight: 500;
    color: #8b949e;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 32px 28px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .arabic {
    font-family: "Scheherazade New", serif;
    font-size: 2rem;
    line-height: 2.4;
    text-align: right;
    direction: rtl;
    color: #e6edf3;
  }

  .translation {
    font-size: 0.95rem;
    line-height: 1.7;
    color: #c9d1d9;
  }

  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    border-top: 1px solid #21262d;
  }

  .verse-ref {
    font-size: 0.85rem;
    color: #8b949e;
  }

  .quran-link {
    font-size: 0.82rem;
    color: #58a6ff;
    text-decoration: none;
  }
  .quran-link:hover { text-decoration: underline; }

  .loading-text {
    color: #8b949e;
    font-size: 0.95rem;
    text-align: center;
    margin: auto;
  }

  .question {
    text-align: center;
    font-size: 1rem;
    color: #8b949e;
  }

  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .btn {
    padding: 16px 12px;
    border-radius: 10px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    line-height: 1.3;
  }
  .btn:hover  { opacity: 0.88; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; }

  .btn-yes {
    background: #1f6feb;
    color: #fff;
  }
  .btn-no {
    background: #21262d;
    color: #e6edf3;
    border: 1px solid #30363d;
  }

  .btn-skip {
    background: transparent;
    border: none;
    color: #8b949e;
    font-size: 0.82rem;
    cursor: pointer;
    text-align: center;
    padding: 4px;
  }
  .btn-skip:hover { color: #c9d1d9; }

  .progress {
    text-align: center;
    font-size: 0.78rem;
    color: #484f58;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #238636;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.85rem;
    transition: transform 0.3s ease;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Quran Verse Review</h1>
  </div>

  <div class="card" id="card">
    <div class="loading-text">Loading…</div>
  </div>

  <p class="question">Can this verse be understood on its own, without reading the verses around it?</p>

  <div class="buttons">
    <button class="btn btn-yes" id="btnYes" disabled>Yes, it stands alone</button>
    <button class="btn btn-no"  id="btnNo"  disabled>No, needs context</button>
  </div>

  <button class="btn-skip" id="btnSkip" disabled>not sure — skip →</button>

  <div class="progress" id="progress"></div>
</div>

<div class="toast" id="toast">Thanks! Opening report form…</div>

<script>
const REPO        = 'DreamsBaddream/quran-standalone-dataset';
const DATASET_URL = 'https://raw.githubusercontent.com/' + REPO + '/main/dataset/standalone_ayahs.json';
const QURAN_API   = 'https://api.alquran.cloud/v1/ayah/';

let verses  = [];
let queue   = [];
let idx     = 0;
let current = null;

async function init() {
  const res  = await fetch(DATASET_URL);
  const data = await res.json();
  verses = data.verses;

  // Show algorithmic entries first (most need review), then the rest
  const algo   = verses.filter(v => v.method !== 'manual');
  const manual = verses.filter(v => v.method === 'manual');
  shuffle(algo);
  shuffle(manual);
  queue = [...algo, ...manual];

  showNext();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

async function showNext() {
  if (idx >= queue.length) idx = 0;
  current = queue[idx++];

  setButtons(false);
  document.getElementById('progress').textContent = `${idx} / ${queue.length} verses`;

  const card = document.getElementById('card');
  card.innerHTML = `
    <div class="arabic loading-text">Loading…</div>
    <div class="translation"></div>
    <div class="meta">
      <span class="verse-ref">${current.key}</span>
      <a class="quran-link" href="https://quran.com/${current.key.replace(':','/')}" target="_blank">read in context ↗</a>
    </div>
  `;

  try {
    const res  = await fetch(QURAN_API + current.key + '/editions/quran-uthmani,en.sahih');
    const data = await res.json();
    if (data.code === 200) {
      card.querySelector('.arabic').textContent      = data.data[0]?.text || '';
      card.querySelector('.translation').textContent = data.data[1]?.text || '';
    }
  } catch {
    card.querySelector('.arabic').textContent      = '(Could not load)';
    card.querySelector('.translation').textContent = '';
  }

  setButtons(true);
}

function setButtons(enabled) {
  document.getElementById('btnYes').disabled  = !enabled;
  document.getElementById('btnNo').disabled   = !enabled;
  document.getElementById('btnSkip').disabled = !enabled;
}

function openIssue() {
  const userSays  = document.getElementById('btnYes').dataset.lastClick === 'yes' ? true : false;
  const shouldBe  = userSays ? 'standalone=true (stands alone)' : 'standalone=false (needs context)';
  const title     = encodeURIComponent(`[CHALLENGE] ${current.key} — should be ${shouldBe}`);
  const body      = encodeURIComponent(
`**Verse:** ${current.key}
**Should be:** ${shouldBe}
**Quran.com:** https://quran.com/${current.key.replace(':','/')}

**Why is it wrong?**
(explain here)
`);
  window.open(`https://github.com/${REPO}/issues/new?title=${title}&body=${body}&labels=classification-challenge`, '_blank');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.getElementById('btnYes').addEventListener('click', () => {
  // User says standalone=true
  if (current.standalone === false) {
    // Disagrees — open issue
    document.getElementById('btnYes').dataset.lastClick = 'yes';
    showToast('Thanks! Opening report form…');
    setTimeout(openIssue, 600);
  }
  showNext();
});

document.getElementById('btnNo').addEventListener('click', () => {
  // User says standalone=false
  if (current.standalone === true) {
    // Disagrees — open issue
    document.getElementById('btnYes').dataset.lastClick = 'no';
    showToast('Thanks! Opening report form…');
    setTimeout(openIssue, 600);
  }
  showNext();
});

document.getElementById('btnSkip').addEventListener('click', showNext);

init();
</script>
</body>
</html>
